<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f172a">
<title>Conteo de inventario · Variedades el Toñeco</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding-bottom:120px}
button{font-family:inherit;cursor:pointer;border:0}
input{font-family:inherit}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header{background:#111827;border-bottom:1px solid #1f2937;position:sticky;top:0;z-index:20}
header .wrap{padding:12px 16px;display:flex;align-items:center;gap:10px}
h1{font-size:17px;color:#fbbf24;font-weight:800;line-height:1.2}
.sub{font-size:12px;color:#94a3b8}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px;margin-bottom:12px}
.lbl{font-size:13px;color:#94a3b8;margin-bottom:6px;display:block;font-weight:600}
.inp{width:100%;background:#0b1220;border:1px solid #334155;border-radius:12px;color:#f8fafc;font-size:17px;padding:12px 14px;outline:none}
.inp:focus{border-color:#f59e0b}
.btn{width:100%;background:#f59e0b;color:#0f172a;font-weight:800;font-size:16px;padding:14px;border-radius:14px}
.btn:active{transform:scale(.98)}
.btn2{background:#1e293b;color:#e2e8f0;border:1px solid #334155;font-weight:700;font-size:14px;padding:10px 14px;border-radius:12px}
.err{color:#f87171;font-size:13px;margin-top:8px;min-height:18px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:14px;text-align:left;color:#e2e8f0;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.cat b{font-size:14px;font-weight:800;line-height:1.2}
.bar{height:6px;background:#0b1220;border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:#10b981;border-radius:6px}
.cat small{font-size:12px;color:#94a3b8}
.row{display:flex;align-items:center;gap:10px;background:#1e293b;border:1px solid #334155;border-radius:14px;padding:10px 12px;margin-bottom:8px}
.row.ok{border-color:#065f46;background:#0d2a24}
.row.sent{border-color:#1e3a5f;background:#0f2238}
.row .n{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.25}
.row .n small{display:block;font-size:11px;font-weight:700;margin-top:2px}
.row input{width:86px;background:#0b1220;border:1px solid #475569;border-radius:10px;color:#fbbf24;font-weight:800;font-size:18px;text-align:center;padding:8px 4px;outline:none}
.row input:focus{border-color:#f59e0b}
.u{font-size:11px;color:#94a3b8;font-weight:700;width:18px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top h2{font-size:18px;font-weight:800;flex:1}
.foot{position:fixed;left:0;right:0;bottom:0;background:#111827;border-top:1px solid #1f2937;z-index:30}
.foot .wrap{padding:12px 16px;display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{width:14px;height:6px;border-radius:3px;background:#334155}
.dots i.on{background:#f59e0b}
.send{background:#10b981;color:#052e16;font-weight:800;font-size:15px;padding:13px 16px;border-radius:14px;white-space:nowrap}
.send.big{animation:pulse 1s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(16,185,129,.6)}to{box-shadow:0 0 0 10px rgba(16,185,129,0)}}
.hidden{display:none!important}
.empty{color:#94a3b8;text-align:center;padding:24px;font-size:14px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#f8fafc;color:#0f172a;font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px;z-index:50;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{max-width:420px;width:100%}
</style>
</head>
<body>

<header><div class="wrap">
  <div style="flex:1">
    <h1>Conteo de inventario</h1>
    <div class="sub" id="hdrSub">Variedades el Toñeco</div>
  </div>
  <button class="btn2 hidden" id="btnSalir" onclick="cambiarNombre()">Cambiar</button>
</div></header>

<!-- CLAVE -->
<div class="wrap" id="vClave">
  <div class="card">
    <label class="lbl" for="iClave">Clave de acceso</label>
    <input class="inp" id="iClave" type="password" inputmode="numeric" placeholder="••••" autocomplete="off">
    <label class="lbl" for="iNombre" style="margin-top:14px">Tu nombre</label>
    <input class="inp" id="iNombre" type="text" placeholder="Ej: Juan" autocomplete="off">
    <div class="err" id="eClave"></div>
    <button class="btn" onclick="entrar()">Entrar</button>
  </div>
</div>

<!-- CATEGORIAS -->
<div class="wrap hidden" id="vCats">
  <div class="card" style="padding:12px 14px">
    <div style="font-size:14px;line-height:1.5">Escoge <b>tu grupo</b> (cada uno tiene unos 50 productos), cuenta lo que hay en anaquel <b>y</b> depósito, y cada <b>10 productos</b> le das <b>Enviar</b>.</div>
  </div>
  <div class="cats" id="catGrid"></div>
  <button class="btn2" style="width:100%;margin-top:16px" onclick="reiniciar()">Empezar un inventario nuevo</button>
</div>

<!-- LISTA -->
<div class="wrap hidden" id="vLista">
  <div class="top">
    <button class="btn2" onclick="verCats()">‹ Volver</button>
    <h2 id="catTitulo"></h2>
  </div>
  <input class="inp" id="iBuscar" type="search" placeholder="Buscar producto…" oninput="pintarLista()" autocomplete="off" style="margin-bottom:12px">
  <div id="lista"></div>
  <button class="btn2" style="width:100%;margin-top:8px" onclick="agregarOtro()">+ Producto que no está en la lista</button>
</div>

<div class="foot hidden" id="foot"><div class="wrap">
  <div style="flex:1">
    <div style="font-size:13px;font-weight:700" id="pendTxt">0 de 10 para enviar</div>
    <div class="dots" id="dots"></div>
  </div>
  <button class="send" id="btnEnviar" onclick="enviar()">Enviar</button>
</div></div>

<div class="modal hidden" id="modal"><div class="card">
  <div style="font-size:17px;font-weight:800;margin-bottom:6px" id="mTit"></div>
  <div style="font-size:14px;color:#cbd5e1;margin-bottom:14px;line-height:1.5" id="mTxt"></div>
  <input class="inp hidden" id="mInp" type="text" style="margin-bottom:12px" autocomplete="off">
  <div style="display:flex;gap:10px">
    <button class="btn2" style="flex:1" onclick="cerrarModal(false)">Cancelar</button>
    <button class="btn" style="flex:1" id="mOk" onclick="cerrarModal(true)">Aceptar</button>
  </div>
</div></div>

// Grupos de ~50 productos para que todos cuenten parecido
const MAX_GRUPO = 50;
const JUNTAR = [['CHARCUTERÍA','COMIDA PARA ANIMALES']];
const GRUPOS = (function(){
  const g=[], hechos={};
  CATS.forEach(cat=>{
    if(hechos[cat]) return;
    const junto=JUNTAR.find(j=>j.includes(cat)) || [cat];
    junto.forEach(c=>hechos[c]=1);
    const lista=PRODUCTOS.filter(p=>junto.includes(p[1])).map(p=>p[0]).sort((a,b)=>a.localeCompare(b,'es'));
    const partes=Math.max(1,Math.ceil((lista.length-5)/MAX_GRUPO)), tam=Math.ceil(lista.length/partes);
    for(let i=0;i<partes;i++){
      const nombres=lista.slice(i*tam,(i+1)*tam);
      const ini=nombres[0].split(' ')[0], fin=nombres[nombres.length-1].split(' ')[0];
      g.push({id:'g'+(g.length+1), num:g.length+1, titulo:junto.join(' + ')+(partes>1?' '+(i+1):''), rango:ini===fin?ini:(ini+' a '+fin), nombres:new Set(nombres)});
    }
  });
  return g;
})();
function grupoDe(nombre){ const g=GRUPOS.find(x=>x.nombres.has(nombre)); return g?g.id:null; }

let S = cargar();
let catActual = null;

function cargar(){
  try { return JSON.parse(localStorage.getItem('toneco_conteo') || '{}'); } catch(e){ return {}; }
}
function guardar(){
  try { localStorage.setItem('toneco_conteo', JSON.stringify(S)); } catch(e){}
}
if(!S.items) S.items = {};      // nombre -> {cant, cat, kg, enviado}
if(!S.extra) S.extra = [];      // productos agregados a mano
if(!S.lote) S.lote = 0;

function todos(){ return PRODUCTOS.concat(S.extra); }
function delGrupo(gid){ const g=GRUPOS.find(x=>x.id===gid); return PRODUCTOS.filter(p=>g.nombres.has(p[0])).concat(S.extra.filter(p=>p[3]===gid)); }
function sinAcento(t){ return String(t).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }
function fmtCant(it){ const v=it.cant; if(it.kg) return (Math.round(v*1000)/1000).toLocaleString('es-VE',{maximumFractionDigits:3})+' kg'; return (Math.round(v*1000)/1000).toLocaleString('es-VE',{maximumFractionDigits:3}); }

/* ---------- entrar ---------- */
function entrar(){
  const c=document.getElementById('iClave').value.trim(), n=document.getElementById('iNombre').value.trim();
  const e=document.getElementById('eClave');
  if(c!==CLAVE){ e.textContent='Clave incorrecta.'; return; }
  if(!n){ e.textContent='Escribe tu nombre.'; return; }
  S.ok=1; S.nombre=n; guardar(); verCats();
}
function cambiarNombre(){
  pedir('Cambiar nombre','Escribe tu nombre:',S.nombre||'',v=>{ if(v.trim()){ S.nombre=v.trim(); guardar(); pintarHdr(); } });
}
function pintarHdr(){
  document.getElementById('hdrSub').textContent = S.nombre ? ('Contando: '+S.nombre) : 'Variedades el Toñeco';
  document.getElementById('btnSalir').classList.toggle('hidden', !S.nombre);
}

/* ---------- categorías ---------- */
function verCats(){
  catActual=null;
  ['vClave','vLista'].forEach(id=>document.getElementById(id).classList.add('hidden'));
  document.getElementById('vCats').classList.remove('hidden');
  pintarHdr(); pintarFoot();
  document.getElementById('catGrid').innerHTML = GRUPOS.map(g=>{
    const ps=delGrupo(g.id), tot=ps.length, hechos=ps.filter(p=>S.items[p[0]]).length;
    const pct=tot?Math.round(hechos*100/tot):0;
    return `<button class="cat" onclick="abrir('${g.id}')"><div><span style="font-size:12px;color:#fbbf24;font-weight:800">GRUPO ${g.num}</span><br><b>${g.titulo}</b><br><small>${g.rango}</small></div><div><small>${hechos} de ${tot} contados</small><div class="bar"><i style="width:${pct}%"></i></div></div></button>`;
  }).join('');
  window.scrollTo(0,0);
}

/* ---------- lista ---------- */
function abrir(gid){
  catActual=gid;
  const g=GRUPOS.find(x=>x.id===gid);
  document.getElementById('vCats').classList.add('hidden');
  document.getElementById('vLista').classList.remove('hidden');
  document.getElementById('catTitulo').textContent='Grupo '+g.num+' · '+g.titulo;
  document.getElementById('iBuscar').value='';
  pintarLista(); pintarFoot(); window.scrollTo(0,0);
}
function pintarLista(){
  const q=sinAcento(document.getElementById('iBuscar').value.trim());
  const lista=delGrupo(catActual).filter(p=>!q || sinAcento(p[0]).includes(q));
  if(!lista.length){ document.getElementById('lista').innerHTML='<div class="empty">No hay productos con ese nombre.</div>'; return; }
  document.getElementById('lista').innerHTML = lista.map(p=>{
    const it=S.items[p[0]], cls=it?(it.enviado?'row sent':'row ok'):'row';
    const est=it?(it.enviado?'<small style="color:#60a5fa">✓ Enviado</small>':'<small style="color:#34d399">Por enviar</small>'):(p[2]?'<small style="color:#fbbf24">Por peso (kg)</small>':'');
    const val=it?String(it.cant).replace('.',','):'';
    return `<div class="${cls}" data-n="${esc(p[0])}"><div class="n">${esc(p[0])}${est}</div><input type="text" inputmode="decimal" placeholder="—" value="${val}" onchange="anotar(this)" onfocus="this.select()"><span class="u">${p[2]?'kg':''}</span></div>`;
  }).join('');
}
function anotar(inp){
  const nombre=inp.closest('.row').getAttribute('data-n').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  const p=todos().find(x=>x[0]===nombre); if(!p) return;
  const raw=inp.value.trim().replace(',','.');
  if(raw===''){ delete S.items[nombre]; guardar(); pintarLista(); pintarFoot(); return; }
  const v=parseFloat(raw);
  if(isNaN(v)||v<0){ toast('Escribe solo números.'); inp.value=''; return; }
  const ant=S.items[nombre];
  const gg=GRUPOS.find(x=>x.id===(p[3]||grupoDe(nombre)));
  S.items[nombre]={cant:v, cat:gg?('Grupo '+gg.num+' · '+gg.titulo):p[1], kg:p[2]?1:0, enviado:false, corregido: !!(ant && ant.enviado && ant.cant!==v), t:Date.now()};
  guardar();
  const row=inp.closest('.row'); row.className='row ok';
  row.querySelector('.n').innerHTML=esc(nombre)+'<small style="color:#34d399">Por enviar</small>';
  pintarFoot();
  if(pendientes().length>=LOTE){ toast('¡Ya tienes '+LOTE+'! Dale Enviar.'); }
}
function agregarOtro(){
  pedir('Producto que no está','Escribe el nombre como sale en la etiqueta:','',v=>{
    v=v.trim().toUpperCase(); if(!v) return;
    if(todos().some(p=>p[0].toUpperCase()===v)){ toast('Ese ya está en la lista.'); return; }
    const g=GRUPOS.find(x=>x.id===catActual);
    S.extra.push([v,g.titulo,0,catActual]); guardar(); pintarLista();
    toast('Agregado. Escribe la cantidad.');
  });
}

/* ---------- enviar ---------- */
function pendientes(){
  return Object.keys(S.items).filter(n=>!S.items[n].enviado).map(n=>({nombre:n, ...S.items[n]})).sort((a,b)=>a.t-b.t);
}
function pintarFoot(){
  const foot=document.getElementById('foot');
  const pend=pendientes(), n=pend.length;
  foot.classList.toggle('hidden', !S.ok || (n===0 && !catActual));
  document.getElementById('pendTxt').textContent = n>=LOTE ? '¡Listo! Envía estos '+Math.min(n,LOTE) : (n+' de '+LOTE+' para enviar');
  document.getElementById('dots').innerHTML = Array.from({length:LOTE},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('');
  const b=document.getElementById('btnEnviar');
  b.textContent = n ? ('Enviar '+Math.min(n,LOTE)) : 'Enviar';
  b.classList.toggle('big', n>=LOTE);
  b.style.opacity = n ? 1 : .45;
}
function enviar(){
  let pend=pendientes();
  if(!pend.length){ toast('Todavía no has contado nada.'); return; }
  const lote=pend.slice(0,LOTE).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  const go=()=>{
    S.lote=(S.lote||0)+1;
    const f=new Date(), fecha=f.toLocaleDateString('es-VE')+' '+f.toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'});
    const cats=[...new Set(lote.map(x=>x.cat))].join(', ');
    let msg='📦 *CONTEO DE INVENTARIO*\n';
    msg+='👤 '+(S.nombre||'')+'\n🗂️ '+cats+'\n';
    msg+='📅 '+fecha+'  ·  Lote '+S.lote+'\n\n';
    lote.forEach((x,i)=>{ msg+=(i+1)+'. '+x.nombre+' → *'+fmtCant(x)+'*'+(x.corregido?'  ✏️ corregido':'')+'\n'; });
    msg+='\n_Anaquel + depósito_';
    lote.forEach(x=>{ S.items[x.nombre].enviado=true; S.items[x.nombre].corregido=false; });
    guardar();
    window.open('https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(msg),'_blank');
    if(catActual) pintarLista(); else verCats();
    pintarFoot();
  };
  if(pend.length<LOTE) confirmar('Enviar '+pend.length+' producto'+(pend.length>1?'s':''),'Todavía no llegas a '+LOTE+'. ¿Los envías igual? (Úsalo cuando termines tu categoría.)',go);
  else go();
}

/* ---------- reiniciar ---------- */
function reiniciar(){
  const pend=pendientes().length;
  confirmar('Inventario nuevo', (pend?('⚠️ Tienes '+pend+' sin enviar. '):'')+'Se borra todo lo contado en este teléfono. ¿Seguro?', ()=>{
    S.items={}; S.extra=[]; S.lote=0; guardar(); verCats(); toast('Listo, puedes empezar.');
  });
}

/* ---------- ventanitas ---------- */
let mCb=null, mPedir=false;
function confirmar(t,txt,cb){ mostrarModal(t,txt,false,'',cb); }
function pedir(t,txt,val,cb){ mostrarModal(t,txt,true,val,cb); }
function mostrarModal(t,txt,conInput,val,cb){
  document.getElementById('mTit').textContent=t; document.getElementById('mTxt').textContent=txt;
  const i=document.getElementById('mInp'); i.classList.toggle('hidden',!conInput); i.value=val||'';
  mCb=cb; mPedir=conInput; document.getElementById('modal').classList.remove('hidden');
  if(conInput) setTimeout(()=>i.focus(),50);
}
function cerrarModal(ok){
  document.getElementById('modal').classList.add('hidden');
  const cb=mCb; mCb=null;
  if(ok && cb) cb(mPedir?document.getElementById('mInp').value:undefined);
}

/* ---------- inicio ---------- */
if(S.ok && S.nombre) verCats(); else { document.getElementById('iNombre').value=S.nombre||''; pintarHdr(); }
