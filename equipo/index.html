const K = 'toneco_equipo_v1';
let S = load();
function load() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(K)); } catch (e) {}
  d = d || {};
  d.me = d.me || null;            // trabajador de este teléfono
  d.day = d.day || {};            // { 'fernando|2026-11-14': {done:[...], nov:'', sent:false} }
  d.obs = d.obs || {};            // { fernando: [{f, t}] } observaciones recibidas
  d.reps = d.reps || [];          // reportes recibidos (teléfono del dueño)
  d.evals = d.evals || [];        // evaluaciones guardadas
  d.pin = d.pin || null;
  d.owner = !!d.owner;
  return d;
}
function save() { try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {} }

   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
function hoy(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
function fechaBonita(iso) { const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d); return DIAS[dt.getDay()] + ' ' + pad(d) + '/' + pad(m); }
function hid(t) { let h = 0; for (const c of t) h = (h * 31 + c.charCodeAt(0)) | 0; return (h >>> 0).toString(36); }
function itemsOf(w) {
  const t = TEAM[w], out = [];
  t.checklist.forEach(sec => sec.items.forEach(x => { const tt = Array.isArray(x) ? x[0] : x, dd = Array.isArray(x) ? x[1] : ''; out.push({ id: hid(tt), t: tt, d: dd, s: sec.s }); }));
  COMUNES.forEach(x => out.push({ id: hid(x), t: x, s: '⭐ Atención al cliente y orden (todos)' }));
  return out;
}
function textOf(w, id) { const it = itemsOf(w).find(x => x.id === id); return it ? it.t : '(tarea cambiada)'; }
function color(p) { return p >= 90 ? '#16a34a' : p >= 70 ? '#ca8a04' : '#dc2626'; }
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2600); }
function enc(o) { return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function dec(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return JSON.parse(decodeURIComponent(escape(atob(s)))); }
function pageUrl() { return location.href.split('#')[0].split('?')[0]; }
function openWa(text, num) { const u = 'https://wa.me/' + (num || '') + '?text=' + encodeURIComponent(text); const w = window.open(u, '_blank'); if (!w) location.href = u; }

/* =====================================================================
   Enlaces que llegan por WhatsApp (#r = reporte, #o = observación)
   ===================================================================== */
function importarDesdeEnlace() {
  const h = location.hash;
  if (!h || h.length < 4) return null;
  let res = null;
  try {
    if (h.startsWith('#r=')) {
      const r = dec(h.slice(3));
      if (r && TEAM[r.w] && r.d) {
        const i = S.reps.findIndex(x => x.w === r.w && x.d === r.d);
        if (i >= 0) S.reps[i] = r; else S.reps.push(r);
        S.reps.sort((a, b) => (b.d + b.h).localeCompare(a.d + a.h));
        save();
        res = { kind: 'r', msg: 'Reporte de ' + TEAM[r.w].name + ' guardado ✅' };
      }
    } else if (h.startsWith('#m=')) { res = importarMeta(h); } else if (h.startsWith('#m=')) { res = importarMeta(h); } else if (h.startsWith('#o=')) {
      const o = dec(h.slice(3));
      if (o && TEAM[o.w] && o.t) {
        S.obs[o.w] = S.obs[o.w] || [];
        if (!S.obs[o.w].some(x => x.f === o.f && x.t === o.t)) S.obs[o.w].unshift({ f: o.f, t: o.t });
        save();
        res = { kind: 'o', w: o.w, msg: 'Nueva observación de ' + OWNER.name + ' 📝' };
      }
    }
  } catch (e) { res = { kind: 'x', msg: 'Ese enlace no se pudo leer' }; }
  history.replaceState(null, '', pageUrl());
  return res;
}

function pararScan() {

function codigoInventado() {

}

async function escanear(alLeer) {
  let box = $('scanBox'), propio = false;
  if (!box) {   // escanear para buscar: abre su propia ventanita
    const m = $('alModal'); m.innerHTML = `<div class="box"><h2>📷 Apunta al código de barras</h2><div id="scanBox"></div><button class="btn ghost" id="cCancel">Cerrar</button></div>`; m.hidden = false; box = $('scanBox'); propio = true;
  }
  pararScan();
  let listo = false;
  const leido = txt => { if (listo) return; listo = true; try { navigator.vibrate && navigator.vibrate(120); } catch (e) {} pararScan(); if (propio) cerrarCodigo(); alLeer(String(txt).trim()); };
  const falla = msg => { toast(msg || 'Permite el uso de la cámara para escanear'); pararScan(); if (propio) cerrarCodigo(); else if (box) box.innerHTML = ''; };
  // 1) Lector nativo del teléfono (Chrome en Android): rápido y sin descargar nada
  let nativoOk = false;
  try { if ('BarcodeDetector' in window) { const fs = await BarcodeDetector.getSupportedFormats(); nativoOk = fs && fs.length > 0; } } catch (e) {}
  if (nativoOk) {
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
    catch (e) { falla(); return; }
    box.innerHTML = '<video playsinline muted autoplay></video><div class="mira"></div><div class="rayo"></div>';
    const v = box.querySelector('video'); v.srcObject = stream;
    try { await v.play(); } catch (e) {}
    const det = new BarcodeDetector({ formats: (await BarcodeDetector.getSupportedFormats()).filter(f => /ean|upc|code_128|code_39|itf|qr/.test(f)) });
    const S2 = { nativo: true, vivo: true, stream }; scanner = S2;
    const ciclo = async () => {
      if (!S2.vivo) return;
      try { if (v.readyState >= 2) { const r = await det.detect(v); if (r && r.length && r[0].rawValue) { leido(r[0].rawValue); return; } } } catch (e) {}
      setTimeout(ciclo, 180);
    };
    ciclo(); return;
  }
  // 2) Otros teléfonos (iPhone, etc.): librería html5-qrcode
  try { await cargarJs('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'); } catch (e) { falla('No se pudo abrir el escáner (sin internet)'); return; }
  const F = Html5QrcodeSupportedFormats, fmts = [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.ITF, F.QR_CODE];
  scanner = new Html5Qrcode('scanBox', { formatsToSupport: fmts, verbose: false });
  scanner.start({ facingMode: 'environment' }, { fps: 12, qrbox: { width: 260, height: 130 } }, leido, () => {}).catch(() => falla());
}

/* ===== 🎯 Metas del dueño ===== */
function metasLista(w) { return (S.metasX && S.metasX[w]) || METAS_VENTA[w] || []; }
function lunesDe(d) { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function metaDe(w) { const L = metasLista(w); return metasActivas(w)[0] || L[L.length - 1] || null; }
function importarMeta(h) {
  const q = dec(h.slice(3)), ok = /^\d{4}-\d{2}-\d{2}$/;
  if (!q || !TEAM[q.w] || !ok.test(q.desde) || !ok.test(q.hasta)) return null;
  S.metasX = S.metasX || {};
  S.metasX[q.w] = [{ id: String(q.id).replace(/[^\w-]/g, '').slice(0, 40), producto: String(q.producto).slice(0, 60), uno: String(q.uno || '').slice(0, 40), meta: Math.max(1, +q.meta || 1), premio: String(q.premio || '').slice(0, 60), desde: q.desde, hasta: q.hasta }];
  S.me = q.w; save();
  return { kind: 'm', msg: '¡Tienes una meta nueva! 🎯' };
}
function metaResultado(w) {
  const m = metaDe(w); if (!m) return null;
  const r = S.reps.find(x => x.w === w && x.d >= m.desde && x.d <= m.hasta && x.mv && x.mv.some(v => v.p === m.producto));
  const v = r ? r.mv.find(v => v.p === m.producto) : null, tot = v ? v.tot : 0;
  const p = Math.round(tot / m.meta * 100), falta = Math.max(0, m.meta - tot), dr = diasRestan(m), pd = dr ? Math.ceil(falta / dr) : falta, n = TEAM[w].name;
  let txt;
  if (!r) txt = 🎯 *${n}*, todavía no he recibido tu reporte con las ventas de ${m.producto}. Envíalo hoy para ver cómo vas con tu meta de ${m.meta}.;
  else if (tot >= m.meta) txt = 🎉 *¡${n}, META CUMPLIDA!*\nVendiste ${tot} de ${m.meta} ${m.producto} (${p}%).\n🏆 Ganaste: ${m.premio}\n¡Felicitaciones, excelente trabajo! 💪;
  else txt = 🎯 *${n}, así vas con tu meta* (reporte del ${fechaBonita(r.d)})\n${m.producto}: ${tot} de ${m.meta} (${p}%)\nTe faltan ${falta}. ${dr ? 'Quedan ' + dr + (dr === 1 ? ' día' : ' días') + ' (hasta el ' + fechaBonita(m.hasta) + '): unos ' + pd + ' por día.' : 'La meta ya terminó.'}\n🏆 Premio: ${m.premio}\n¡Tú puedes! 🔥;
  return { m, r, tot, p, falta, txt };
}
function ownerMetas() {
  const w = view.mw || Object.keys(TEAM)[0], R = metaResultado(w), m = R && R.m, lu = lunesDe(new Date()), dom = new Date(lu);
  dom.setDate(lu.getDate() + 6);
  const f = (view.mf && view.mf.w === w) ? view.mf : (view.mf = { w, prod: m ? m.producto : '', uno: m ? (m.uno || '') : '', cant: m ? m.meta : '', prem: m ? m.premio : '$5 de reconocimiento', desde: hoy(lu), hasta: hoy(dom) });
  return <div class="chips">${Object.entries(TEAM).map(([k, t]) => `<button class="chip ${w === k ? 'on' : ''}" data-mw="${k}">${esc(t.name)}</button>).join('')}</div>
  <div class="card"><h2>Meta de ${esc(TEAM[w].name)}</h2>` + (R ? `<p><b>${m.meta} ${esc(m.producto)}</b> · premio: ${esc(m.premio)}<br><span class="mut">${fechaBonita(m.desde)} al ${fechaBonita(m.hasta)}</span></p>
    <div class="prog"><i style="width:${Math.min(100, R.p)}%"></i></div>
    <p><b style="font-size:28px;color:${color(R.p)}">${R.p}%</b> <span class="mut">${R.tot} de ${m.meta}${R.r ? ' · reporte del ' + fechaBonita(R.r.d) : ' · sin reporte esta semana'}</span></p>
    <button class="btn wa" id="mRes">📤 Enviarle su resultado</button>` : '<p class="mut">Todavía no tiene meta.</p>') + `</div>
  <div class="card"><h2>Nueva meta</h2>
    <p class="mut">Se envía por WhatsApp. Al tocar el enlace, la meta se activa en su app con el contador en cero.</p>
    <label class="mut">Producto (ej: combos Lailas)</label><input type="text" id="mProd" value="${esc(f.prod)}">
    <label class="mut">Cada uno se llama (ej: combo)</label><input type="text" id="mUno" value="${esc(f.uno)}">
    <label class="mut">Cantidad a vender</label><input type="text" id="mCant" inputmode="numeric" value="${esc(f.cant)}">
    <label class="mut">Premio</label><input type="text" id="mPrem" value="${esc(f.prem)}">
    <label class="mut">Desde (AAAA-MM-DD)</label><input type="text" id="mDesde" value="${esc(f.desde)}">
    <label class="mut">Hasta (AAAA-MM-DD)</label><input type="text" id="mHasta" value="${esc(f.hasta)}">
    <button class="btn pri" id="mNew">📤 Enviar meta nueva por WhatsApp</button></div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-mw],#mRes,#mNew'); if (!b) return;
  if (b.dataset.mw) { view.mw = b.dataset.mw; render(); return; }
  const w = view.mw || Object.keys(TEAM)[0];
  if (b.id === 'mRes') { const R = metaResultado(w); if (R) openWa(R.txt); else toast('Primero crea una meta'); return; }
  const f = view.mf, cant = parseInt(f && f.cant, 10), ok = /^\d{4}-\d{2}-\d{2}$/;
  if (!f || !String(f.prod).trim() || !(cant > 0)) { toast('Escribe el producto y la cantidad'); return; }
  if (!ok.test(f.desde) || !ok.test(f.hasta) || f.hasta < f.desde) { toast('Revisa las fechas (AAAA-MM-DD)'); return; }
  const m = { w, id: 'm' + hid(String(f.prod).trim()) + f.desde.replace(/-/g, ''), producto: String(f.prod).trim().slice(0, 60), uno: String(f.uno || '').trim().slice(0, 40), meta: cant, premio: String(f.prem || '').trim().slice(0, 60), desde: f.desde, hasta: f.hasta };
  S.metasX = S.metasX || {}; S.metasX[w] = [{ id: m.id, producto: m.producto, uno: m.uno, meta: m.meta, premio: m.premio, desde: m.desde, hasta: m.hasta }]; save();
  openWa(`🎯 *Nueva meta para ${TEAM[w].name}*\nVender ${cant} ${m.producto}\n📅 Del ${fechaBonita(m.desde)} al ${fechaBonita(m.hasta)}\n🏆 Premio: ${m.premio}\n\nToca para activarla en tu app:\n${pageUrl()}#m=${enc(m)}`);
  render();
});
document.addEventListener('input', e => {
  const k = { mProd: 'prod', mUno: 'uno', mCant: 'cant', mPrem: 'prem', mDesde: 'desde', mHasta: 'hasta' }[e.target.id];
  if (k && view.mf) view.mf[k] = e.target.value;
});
  function manejarEnlace(alArrancar) {
  const r = importarDesdeEnlace();
  if (r && r.kind === 'r') { if (view.mode === 'owner') { view.tab = 'reps'; render(); toast(r.msg); } else { view = { mode: null, tab: 'check' }; render(); toast(r.msg + ' · entra a tu panel'); } return; }
  if (r && r.kind === 'o') { S.me = r.w; save(); view = { mode: 'worker', tab: 'obs' }; render(); toast(r.msg); return; }
  if (r && r.kind === 'm') { view = { mode: 'worker', tab: 'check' }; render(); toast(r.msg); return; } if (r && r.kind === 'm') { view = { mode: 'worker', tab: 'check' }; render(); toast(r.msg); return; } if (r && r.kind === 'm') { view = { mode: 'worker', tab: 'check' }; render(); toast(r.msg); return; } if (r) toast(r.msg);
  if (alArrancar) { view = S.me && TEAM[S.me] ? { mode: 'worker', tab: 'check' } : { mode: null, tab: 'check' }; render(); }
}
// Enlace directo por trabajador: .../equipo/?p=osmary
(function () { try { const q = new URLSearchParams(location.search).get('p'); if (q && TEAM[q.toLowerCase()]) { S.me = q.toLowerCase(); save(); } } catch (e) {} })();
window.addEventListener('hashchange', () => manejarEnlace(false));
manejarEnlace(true);
</script>
