<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Conteo de inventario · Toñeco</title>
<style>
:root{--navy:#0b1f3a;--gold:#f5b301;--bg:#f2f4f8;--card:#fff;--txt:#0f172a;--mut:#64748b;--ok:#16a34a;--no:#dc2626;--line:#e2e8f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:120px}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.top h1{margin:0;font-size:18px;line-height:1.2}.top h1 small{display:block;color:var(--gold);font-size:12px;font-weight:600;margin-top:2px}
.prog{height:8px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.pinfo{display:flex;justify-content:space-between;font-size:12px;margin-top:4px;color:#cbd5e1}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.card h2{margin:0 0 8px;font-size:17px}
.mut{color:var(--mut);font-size:13px}
input[type=text],input[type=password],select{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--txt)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:16px;background:var(--navy);color:#fff;margin-top:10px}
.btn.wa{background:#16a34a}.btn.gold{background:var(--gold);color:var(--navy)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.it{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .n{font-weight:700;font-size:15px;line-height:1.25}
.it .n small{display:block;font-weight:500;color:var(--mut);font-size:12px;margin-top:2px}
.it input{text-align:center;font-weight:800;font-size:18px;padding:10px 6px}
.it .q{display:flex;flex-direction:column;gap:4px}.it .q small{font-size:11px;color:var(--mut);text-align:center;font-weight:700;margin-bottom:-2px}
.it .ub{margin-top:6px;border:1px dashed var(--line);background:#fff;color:var(--navy);border-radius:8px;padding:4px 9px;font-weight:700;font-size:12px}
.it.ok .n{text-decoration:line-through;color:var(--mut)}
.it.ok input{background:#f0fdf4;border-color:#86efac;color:#15803d}
.it .ed{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-weight:800;font-size:16px;color:var(--navy)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;z-index:6}
.bar .t{flex:1;font-size:13px;color:var(--mut)}.bar .t b{color:var(--txt);font-size:15px}
.bar button{border:0;border-radius:12px;padding:12px 12px;font-size:14px;font-weight:800;background:#16a34a;color:#fff}
.bar button:disabled{background:#cbd5e1}
.dep{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.dep:last-child{border-bottom:0}.dep label{flex:1;display:flex;gap:10px;align-items:center;font-weight:700}
.dep input{width:22px;height:22px}.dep .pp{font-size:13px;color:var(--mut);white-space:nowrap}
.dep .mini{height:6px;width:70px;background:var(--line);border-radius:99px;overflow:hidden}.dep .mini i{display:block;height:100%;background:var(--ok)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;z-index:20;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:12px;padding:12px;font-weight:600}
</style>
</head>

async function guardar(inp, irSiguiente) {

  const row = inp.closest('.it'), iP = row.querySelector('input:not([data-u])'), iU = row.querySelector('input[data-u]');

  const tP = iP.value.trim(), tU = iU ? iU.value.trim() : '';
  if (tP === '' && tU === '') { if (irSiguiente) siguiente(inp); return; }
  const v = tP === '' ? 0 : num(tP), u = tU === '' ? 0 : num(tU);
  if (v === null || u === null) { toast('Cantidad no válida'); inp.select(); return; }
  const antes = L[id];
  if (antes && antes.cant === v && (+antes.u || 0) === u) { if (irSiguiente) siguiente(inp); return; }

function abrirWa(txt) { const u = 'https://wa.me/' + OWNER.wa + '?text=' + encodeURIComponent(txt); const w = window.open(u, '_blank'); if (!w) location.href = u; }
async function enviarTodo() {   // todo lo contado en este teléfono, por si un mensaje no se mandó

    const u = 'https://wa.me/?text=' + encodeURIComponent(txt); const w = window.open(u, '_blank'); if (!w) location.href = u;
  }
  if (b.id === 'todo') { const u = 'https://wa.me/' + OWNER.wa + '?text=' + encodeURIComponent(todoTexto()); const w = window.open(u, '_blank'); if (!w) location.href = u; }
});
window.addEventListener('hashchange', () => location.reload());
(async () => { const d = H.get('d'); if (d) DUENO = (await sha('dueno|' + d)) === OWNER_H; if (DUENO) try { localStorage.setItem('conteo_dueno', location.href); } catch (e) {} pintar(); if (TOKEN.length >= 20) escuchar(); })();
