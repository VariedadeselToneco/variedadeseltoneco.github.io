:root{--navy:#0b1f3a;--gold:#f5b301;--bg:#f2f4f8;--card:#fff;--txt:#0f172a;--mut:#64748b;--ok:#16a34a;--no:#dc2626;--line:#e2e8f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:120px}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.top h1{margin:0;font-size:18px;line-height:1.2}.top h1 small{display:block;color:var(--gold);font-size:12px;font-weight:600;margin-top:2px}
.prog{height:8px;background:rgba(255,255,255,.18);border-radius:99px;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .3s}
.pinfo{display:flex;justify-content:space-between;font-size:12px;margin-top:4px;color:#cbd5e1}
main{padding:12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.card h2{margin:0 0 8px;font-size:17px}
.mut{color:var(--mut);font-size:13px}
input[type=text],input[type=password],select{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--txt)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:16px;background:var(--navy);color:#fff;margin-top:10px}
.btn.wa{background:#16a34a}.btn.gold{background:var(--gold);color:var(--navy)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.it{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .n{font-weight:700;font-size:15px;line-height:1.25}
.it .n small{display:block;font-weight:500;color:var(--mut);font-size:12px;margin-top:2px}
.it input{text-align:center;font-weight:800;font-size:18px;padding:10px 6px}
.it.ok .n{text-decoration:line-through;color:var(--mut)}
.it.ok input{background:#f0fdf4;border-color:#86efac;color:#15803d}
.it .ed{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-weight:800;font-size:16px;color:var(--navy)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;z-index:6}
.bar .t{flex:1;font-size:13px;color:var(--mut)}.bar .t b{color:var(--txt);font-size:15px}
.bar button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;background:#16a34a;color:#fff}
.bar button:disabled{background:#cbd5e1}
.dep{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.dep:last-child{border-bottom:0}.dep label{flex:1;display:flex;gap:10px;align-items:center;font-weight:700}
.dep input{width:22px;height:22px}.dep .pp{font-size:13px;color:var(--mut);white-space:nowrap}
.dep .mini{height:6px;width:70px;background:var(--line);border-radius:99px;overflow:hidden}.dep .mini i{display:block;height:100%;background:var(--ok)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;z-index:20;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:12px;padding:12px;font-weight:600}
</style>

}
const MIOS = LISTA.filter(enSegmento).sort((p, q) => p[1].localeCompare(q[1], 'es'));
function segTexto(seg) { seg = seg || SEG; const d = seg.deps.length ? seg.deps.join(', ') : 'Todos los departamentos'; return d + (seg.a || seg.b ? ' · letras ' + (seg.a || 'A') + '–' + (seg.b || 'Z') : ''); }

/* ---------- Firebase ---------- */
let DB = null, L = {}, CFG = null, FB_ERR = '';
function cargarJs(src) { return new Promise((ok, no) => { const x = document.createElement('script'); x.src = src; x.onload = ok; x.onerror = no; document.head.appendChild(x); }); }
async function fb() {
  if (DB) return DB;
  const V = 'https://www.gstatic.com/firebasejs/10.14.1/';
  await cargarJs(V + 'firebase-app-compat.js'); await cargarJs(V + 'firebase-auth-compat.js'); await cargarJs(V + 'firebase-firestore-compat.js');
  const app = firebase.initializeApp(FB_CFG, 'conteo'), db = app.firestore();
  try { db.settings({ experimentalForceLongPolling: true }); } catch (e) {}
  await app.auth().signInAnonymously();
  DB = db; return db;
}
function escuchar() {
  fb().then(db => {
    db.doc('conteos/' + TOKEN).onSnapshot(sn => { CFG = sn.exists ? sn.data() : {}; pintar(); }, e => { FB_ERR = msgErr(e); pintar(); });
    db.collection('conteos/' + TOKEN + '/lineas').onSnapshot(qs => {
      qs.docChanges().forEach(ch => { if (ch.type === 'removed') delete L[ch.doc.id]; else L[ch.doc.id] = ch.doc.data(); });
      FB_ERR = ''; refrescar();
    }, e => { FB_ERR = msgErr(e); pintar(); });
  }).catch(() => { FB_ERR = 'Sin internet. Lo que cuentes se guarda y se envía cuando vuelva la conexión.'; pintar(); });
}
function msgErr(e) { return e && e.code === 'permission-denied' ? 'El conteo todavía no está activado (faltan las reglas de Firebase). Avísale a ' + OWNER.name + '.' : 'No hay conexión con el servidor. Revisa tu internet.'; }
async function sha(t) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('toneco|' + t)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); }

/* ---------- pantalla ---------- */
let tab = 'falta', q = '';
function contado(x) { return L[idDe(x[0])]; }
function pintar() {
  const m = $('main');
  if (!TOKEN || TOKEN.length < 20) { $('bar').hidden = true; m.innerHTML = '<div class="card err">Este enlace está incompleto. Pídele a ' + OWNER.name + ' que te lo vuelva a mandar.</div>'; return; }
  if (DUENO) return pintarDueno();
  if (!S.nombre || !S.okClave) return pintarEntrada();
  $('tit').innerHTML = 'Conteo · ' + esc(S.nombre) + '<small>' + esc(segTexto()) + '</small>';
  const ok = MIOS.filter(contado).length, tot = MIOS.length;
  $('prog').innerHTML = `<div class="prog"><i style="width:${tot ? ok / tot * 100 : 0}%"></i></div><div class="pinfo"><span>${ok} de ${tot} contados</span><span>${tot - ok} por contar</span></div>`;
  const ql = sinAcento(q);
  const ver = MIOS.filter(x => (tab === 'falta' ? !contado(x) || S.recien && S.recien[idDe(x[0])] : !!contado(x)) && (!ql || sinAcento(x[1]).includes(ql) || String(x[0]).includes(q)));
  m.innerHTML = (FB_ERR ? '<div class="card err">' + esc(FB_ERR) + '</div>' : '') +
    `<div class="card"><input type="text" id="q" placeholder="🔎 Buscar producto" value="${esc(q)}" autocomplete="off">
     <div class="chips"><button class="chip ${tab === 'falta' ? 'on' : ''}" data-tab="falta">Por contar (${tot - ok})</button><button class="chip ${tab === 'ok' ? 'on' : ''}" data-tab="ok">✔ Contados (${ok})</button></div>
     <p class="mut" style="margin:0">Escribe la cantidad que hay y toca <b>Siguiente</b> en el teclado. Cada ${LOTE} productos se le envían a ${OWNER.name} por WhatsApp.</p></div>
     <div class="card" id="lista">${ver.length ? ver.slice(0, 400).map(fila).join('') : '<div class="empty">' + (tab === 'falta' ? (q ? 'No encontré ese producto por contar.' : '🎉 ¡Terminaste tu parte! Toca "Enviar" abajo si quedó algo por mandar.') : 'Todavía no has contado nada.') + '</div>'}</div>`;
  pintarBarra();
}
function fila(x) {
  const id = idDe(x[0]), c = contado(x);
  if (tab === 'ok') return `<div class="it ok"><div class="n">${esc(x[1])}<small>${c.por ? 'Contó: ' + esc(c.por) : ''}</small></div><button class="ed" data-ed="${esc(id)}">${fmt(c.cant)} ✏️</button></div>`;
  return `<div class="it ${c ? 'ok' : ''}" id="r_${esc(id)}"><div class="n">${esc(x[1])}</div><input type="text" inputmode="decimal" enterkeyhint="next" data-id="${esc(id)}" value="${c ? esc(fmt(c.cant)) : ''}" placeholder="—" autocomplete="off"></div>`;
}
function pintarBarra() {
  const b = $('bar'); b.hidden = false; const n = S.pend.length;
  b.innerHTML = `<div class="t">Por enviar a ${OWNER.name}: <b>${n}</b></div><button id="env" ${n ? '' : 'disabled'}>📤 Enviar ahora</button>`;
}
function refrescar() {   // llegó algo de otro teléfono: no redibujo mientras escriben
  const a = document.activeElement;
  if (a && a.tagName === 'INPUT') { actualizarProgreso(); return; }
  pintar();
}
function actualizarProgreso() { const ok = MIOS.filter(contado).length, tot = MIOS.length, p = $('prog'); if (p && !DUENO) p.innerHTML = `<div class="prog"><i style="width:${tot ? ok / tot * 100 : 0}%"></i></div><div class="pinfo"><span>${ok} de ${tot} contados</span><span>${tot - ok} por contar</span></div>`; }

function pintarEntrada() {
  $('bar').hidden = true;
  $('tit').innerHTML = 'Conteo de inventario<small>' + esc(segTexto()) + ' · ' + MIOS.length + ' productos</small>';
  $('main').innerHTML = (FB_ERR ? '<div class="card err">' + esc(FB_ERR) + '</div>' : '') + `<div class="card"><h2>👋 Bienvenido</h2>
    <p class="mut">Vas a contar los productos de: <b>${esc(segTexto())}</b>.</p>
    <label class="mut">Tu nombre</label><input type="text" id="nom" value="${esc(S.nombre || '')}" placeholder="Ej: Carlos" autocomplete="name">
    <label class="mut" style="display:block;margin-top:10px">Clave que te dio ${OWNER.name}</label><input type="password" id="cla" inputmode="numeric" placeholder="••••">
    <button class="btn" id="entrar">Empezar a contar</button></div>`;
}
async function entrar() {
  const n = $('nom').value.trim(), c = $('cla').value.trim();
  if (n.length < 2) { toast('Escribe tu nombre'); return; }
  if (!CFG) { toast('Conectando… intenta de nuevo en un momento'); return; }
  if (!CFG.claveH) { toast(OWNER.name + ' todavía no ha puesto la clave del conteo'); return; }
  if (await sha(c) !== CFG.claveH) { toast('❌ Clave incorrecta'); return; }
  S.nombre = n.slice(0, 30); S.okClave = CFG.claveH; save(); pintar();
  setTimeout(() => { const i = document.querySelector('#lista input'); if (i) i.focus(); }, 100);
}

/* ---------- contar ---------- */
async function guardar(inp, irSiguiente) {
  const id = inp.dataset.id, x = MIOS.find(z => idDe(z[0]) === id); if (!x) return;
  const v = num(inp.value);
  if (inp.value.trim() === '') { if (irSiguiente) siguiente(inp); return; }
  if (v === null) { toast('Cantidad no válida'); inp.select(); return; }
  const antes = L[id];
  if (antes && antes.cant === v) { if (irSiguiente) siguiente(inp); return; }
  L[id] = { c: String(x[0]), n: x[1].slice(0, 120), dep: x[2].slice(0, 40), cant: v, por: S.nombre };
  S.recien = S.recien || {}; S.recien[id] = 1;
  if (!S.pend.includes(id)) S.pend.push(id); save();
  const r = $('r_' + id); if (r) r.classList.add('ok');
  actualizarProgreso(); pintarBarra();
  fb().then(db => db.doc('conteos/' + TOKEN + '/lineas/' + id).set(Object.assign({}, L[id], { t: firebase.firestore.FieldValue.serverTimestamp() })))
    .catch(() => toast('⚠️ Sin conexión: se guardó en este teléfono'));
  if (irSiguiente) siguiente(inp);
  if (S.pend.length >= LOTE) enviar();
}
function siguiente(inp) {
  const all = Array.from(document.querySelectorAll('#lista input[data-id]')), i = all.indexOf(inp);
  const nx = all.slice(i + 1).find(e => !e.closest('.it').classList.contains('ok')) || all[i + 1];
  if (nx) { nx.focus(); nx.scrollIntoView({ block: 'center', behavior: 'smooth' }); } else inp.blur();
}
function enviar() {
  if (!S.pend.length) return;
  const ids = S.pend.slice(), lin = [];
  ids.forEach(id => {
    const c = L[id]; if (!c) return;
    const corr = S.env[id] != null && S.env[id] !== c.cant;
    lin.push((corr ? '✏️ CORRECCIÓN ' : '• ') + c.n + ' (' + c.c + '): *' + fmt(c.cant) + '*' + (corr ? ' (antes ' + fmt(S.env[id]) + ')' : ''));
    S.env[id] = c.cant;
  });
  const ok = MIOS.filter(contado).length;
  const txt = `📦 *CONTEO DE INVENTARIO* — ${S.nombre}\n${segTexto()}\n${new Date().toLocaleString('es-VE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })} · avance ${ok}/${MIOS.length}\n\n${lin.join('\n')}`;
  S.pend = []; S.recien = {}; save(); pintarBarra();
  const u = 'https://wa.me/' + OWNER.wa + '?text=' + encodeURIComponent(txt);
  const w = window.open(u, '_blank'); if (!w) location.href = u;
}
async function editar(id) {
  const c = L[id]; if (!c) return;
  const v = prompt('Corregir: ' + c.n + '\nCantidad contada:', fmt(c.cant)); if (v === null) return;
  const n = num(v); if (n === null) { toast('Cantidad no válida'); return; }
  if (n === c.cant) return;
  L[id] = Object.assign({}, c, { cant: n, por: S.nombre });
  if (!S.pend.includes(id)) S.pend.push(id); save();
  fb().then(db => db.doc('conteos/' + TOKEN + '/lineas/' + id).set(Object.assign({}, L[id], { t: firebase.firestore.FieldValue.serverTimestamp() }))).catch(() => {});
  toast('✏️ Corregido. Se enviará como corrección.'); pintar();
}

/* ---------- panel del dueño ---------- */
const DEPS = [...new Set(LISTA.map(x => x[2]))].sort((a, b) => LISTA.filter(x => x[2] === b).length - LISTA.filter(x => x[2] === a).length);
let selDeps = [], letA = '', letB = '';
function pintarDueno() {
  $('bar').hidden = true;
  const ok = LISTA.filter(contado).length;
  $('tit').innerHTML = 'Panel del conteo<small>' + OWNER.name + ' · ' + LISTA.length + ' productos de Chrystal</small>';
  $('prog').innerHTML = `<div class="prog"><i style="width:${ok / LISTA.length * 100}%"></i></div><div class="pinfo"><span>${ok} contados</span><span>${LISTA.length - ok} por contar</span></div>`;
  const dep = d => { const t = LISTA.filter(x => x[2] === d), c = t.filter(contado).length; return `<div class="dep"><label><input type="checkbox" data-dep="${esc(d)}" ${selDeps.includes(d) ? 'checked' : ''}>${esc(d)}</label><span class="pp">${c}/${t.length}</span><span class="mini"><i style="width:${c / t.length * 100}%"></i></span></div>`; };
  $('main').innerHTML = (FB_ERR ? '<div class="card err">' + esc(FB_ERR) + '</div>' : '') +
    (CFG && !CFG.claveH ? `<div class="card"><h2>🔑 Pon la clave del conteo</h2><p class="mut">Se la dices a cada persona que va a contar (no va en el enlace).</p><input type="text" id="nclave" inputmode="numeric" placeholder="Ej: 4821"><button class="btn gold" id="gclave">Guardar clave</button></div>` : '') +
    `<div class="card"><h2>📤 Mandar una parte a contar</h2><p class="mut">1) Marca los departamentos. 2) Si quieres, un rango de letras. 3) Elige en WhatsApp a quién se lo mandas.</p>
     ${DEPS.map(dep).join('')}
     <div class="row2" style="margin-top:10px"><div><label class="mut">Desde la letra</label><input type="text" id="la" maxlength="1" placeholder="A" value="${esc(letA)}"></div><div><label class="mut">Hasta la letra</label><input type="text" id="lb" maxlength="1" placeholder="Z" value="${esc(letB)}"></div></div>
     <button class="btn wa" id="mandar">📲 Mandar enlace por WhatsApp</button><button class="btn ghost" id="copiar">📋 Copiar enlace</button></div>
     <div class="card"><h2>📦 Lo contado hasta ahora (${ok})</h2><button class="btn wa" id="todo">Enviarme todo por WhatsApp</button>${CFG && CFG.claveH ? '<button class="btn ghost" id="cclave">Cambiar la clave</button>' : ''}</div>`;
}
function linkSeg() {
  const a = ($('la').value || '').trim().toUpperCase(), b = ($('lb').value || '').trim().toUpperCase();
  let h = 't=' + TOKEN; if (selDeps.length) h += '&s=' + encodeURIComponent(selDeps.join('~')); if (a) h += '&a=' + encodeURIComponent(a); if (b) h += '&b=' + encodeURIComponent(b);
  const seg = { deps: selDeps.slice(), a, b }, n = LISTA.filter(x => (!seg.deps.length || seg.deps.includes(x[2])) && (!a || sinAcento(x[1]).charAt(0) >= a) && (!b || sinAcento(x[1]).charAt(0) <= b)).length;
  return { url: location.href.split('#')[0] + '#' + h, seg, n };
}
async function guardarClave(v) {
  v = String(v || '').trim(); if (v.length < 4) { toast('La clave debe tener al menos 4 números'); return; }
  try { const db = await fb(); await db.doc('conteos/' + TOKEN).set({ claveH: await sha(v), dueno: OWNER.name, t: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true }); toast('🔑 Clave guardada'); }
  catch (e) { toast('No se pudo guardar: ' + msgErr(e)); }
}
function todoTexto() {
  const por = {}; LISTA.forEach(x => { const c = contado(x); if (c) (por[x[2]] = por[x[2]] || []).push('• ' + x[1] + ' (' + x[0] + '): *' + fmt(c.cant) + '*' + (c.por ? ' — ' + c.por : '')); });
  return '📦 *CONTEO COMPLETO HASTA AHORA*\n' + new Date().toLocaleString('es-VE') + '\n' + Object.keys(por).map(d => '\n*' + d + '*\n' + por[d].join('\n')).join('\n');
}

/* ---------- eventos ---------- */
document.addEventListener('keydown', e => { const i = e.target; if (i.dataset && i.dataset.id && (e.key === 'Enter' || e.key === 'Tab' && !e.shiftKey)) { e.preventDefault(); guardar(i, true); } if (i.id === 'cla' && e.key === 'Enter') entrar(); });
document.addEventListener('change', e => { const i = e.target; if (i.dataset && i.dataset.id) guardar(i, false); if (i.dataset && i.dataset.dep) { const d = i.dataset.dep; selDeps = i.checked ? selDeps.concat([d]) : selDeps.filter(x => x !== d); } });
document.addEventListener('input', e => { if (e.target.id === 'la') letA = e.target.value; if (e.target.id === 'lb') letB = e.target.value; if (e.target.id === 'q') { q = e.target.value; const p = e.target.selectionStart; pintar(); const n = $('q'); n.focus(); try { n.setSelectionRange(p, p); } catch (_) {} } });
document.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; S.recien = {}; save(); pintar(); return; }
  if (b.dataset.ed) { editar(b.dataset.ed); return; }
  if (b.id === 'entrar') entrar();
  if (b.id === 'env') enviar();
  if (b.id === 'gclave') guardarClave($('nclave').value);
  if (b.id === 'cclave') { const v = prompt('Nueva clave del conteo (mínimo 4 números):'); if (v) guardarClave(v); }
  if (b.id === 'mandar' || b.id === 'copiar') {
    const l = linkSeg(); if (!l.n) { toast('Esa selección no tiene productos'); return; }
    if (b.id === 'copiar') { try { await navigator.clipboard.writeText(l.url); toast('📋 Enlace copiado (' + l.n + ' productos)'); } catch (_) { prompt('Copia el enlace:', l.url); } return; }
    const txt = '📦 Hola, te toca contar inventario en Variedades el Toñeco.\nParte: ' + segTexto(l.seg) + ' (' + l.n + ' productos)\n\nAbre este enlace, escribe tu nombre y la clave que te di:\n' + l.url;
    const u = 'https://wa.me/?text=' + encodeURIComponent(txt); const w = window.open(u, '_blank'); if (!w) location.href = u;
  }
  if (b.id === 'todo') { const u = 'https://wa.me/' + OWNER.wa + '?text=' + encodeURIComponent(todoTexto()); const w = window.open(u, '_blank'); if (!w) location.href = u; }
});
window.addEventListener('hashchange', () => location.reload());
(async () => { const d = H.get('d'); if (d) DUENO = (await sha('dueno|' + d)) === OWNER_H; if (DUENO) try { localStorage.setItem('conteo_dueno', location.href); } catch (e) {} pintar(); if (TOKEN.length >= 20) escuchar(); })();
</script>
</body>
