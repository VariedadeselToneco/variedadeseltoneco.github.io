        <button onclick="toggleCart()" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <!-- Ítems agregados -->
      <div id="cart-items" class="overflow-y-auto my-3 flex-1 divide-y divide-slate-700/50 pr-1"></div>

      <!-- Total y Checkout -->

        <div class="flex justify-between items-center text-lg font-bold">
          <span>Total General:</span>
          <span id="cart-total" class="text-emerald-400 text-xl font-black">$0.00</span>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Método de Pago:</label>
          <select id="payment-method" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400 font-medium">

            <option value="Transferencia BNC / Banesco">Transferencia (BNC / Banesco)</option>
            <option value="Zelle">Zelle</option>
            <option value="Banco Chileno (Penta / Estado)">Banco Chileno</option>
            <option value="Efectivo / Divisas">Efectivo / Divisas</option>
          </select>
        </div>

        <button onclick="sendOrder()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg flex items-center justify-center gap-2 text-base transition duration-200">

    let currentCategory = 'Todos';
    let cart = {};

    function init() {
      renderCategories();
      renderProducts();
    }

    function renderCategories() {
      const container = document.getElementById('categories-list');
      container.innerHTML = Object.keys(categoriesData).map(cat => {
        const active = currentCategory === cat;
        return `
          <button onclick="selectCategory('${cat}')" class="px-3.5 py-2 text-xs font-bold rounded-xl whitespace-nowrap transition duration-200 flex items-center gap-1.5 ${active ? 'bg-amber-400 text-slate-950 shadow-md scale-105' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
            <i class="fa-solid ${categoriesData[cat].icon}"></i> ${cat}
          </button>
        `;
      }).join('');
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderCategories();
      
      const banner = document.getElementById('category-banner');
      const title = document.getElementById('banner-title');
      const tag = document.getElementById('banner-tag');
      
      banner.style.backgroundImage = `url('${categoriesData[cat].img}')`;
      title.innerText = cat === 'Todos' ? 'Todos los Productos' : cat;
      tag.innerText = cat === 'Todos' ? 'Catálogo General' : 'Categoría';

      renderProducts();
    }

    function renderProducts() {
      const searchQuery = document.getElementById('search-input').value.toLowerCase();
      const container = document.getElementById('products-container');
      
      const filtered = rawProducts.filter(p => {
        const matchesCategory = currentCategory === 'Todos' || p.cat === currentCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-400 py-12 text-sm font-medium">No encontramos productos en esta búsqueda.</p>`;
        return;
      }

      container.innerHTML = filtered.map(p => {
        const qty = cart[p.id] || 0;
        return `
          <div class="bg-slate-800/80 p-3.5 rounded-2xl border border-slate-700/60 flex justify-between items-center shadow-sm hover:border-slate-600 transition">
            <div class="pr-2">
              <h3 class="font-bold text-slate-100 text-sm leading-tight">${p.name}</h3>
              <p class="text-xs text-amber-400 font-extrabold mt-0.5">$${p.price.toFixed(2)}</p>
            </div>
            <div class="flex items-center gap-1.5 bg-slate-900 border border-slate-700/80 rounded-xl p-1 shrink-0">
              ${qty > 0 ? `
                <button onclick="updateQty(${p.id}, -1)" class="w-7 h-7 bg-slate-800 text-amber-400 rounded-lg font-black hover:bg-slate-700 transition flex items-center justify-center">-</button>
                <span class="text-xs font-black px-1.5 text-white">${qty}</span>
              ` : ''}
              <button onclick="updateQty(${p.id}, 1)" class="w-7 h-7 bg-amber-500 text-slate-950 rounded-lg font-black hover:bg-amber-400 transition flex items-center justify-center">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateQty(id, change) {
      cart[id] = (cart[id] || 0) + change;
      if (cart[id] <= 0) delete cart[id];
      updateCartUI();
      renderProducts();
    }

    function updateCartUI() {
      const totalCount = Object.values(cart).reduce((sum, q) => sum + q, 0);
      document.getElementById('cart-count').innerText = totalCount;

      let totalAmount = 0;
      const itemsContainer = document.getElementById('cart-items');

      if (totalCount === 0) {
        itemsContainer.innerHTML = `<p class="text-center text-slate-400 py-8 text-sm font-medium">Tu carrito está vacío.</p>`;
      } else {
        itemsContainer.innerHTML = Object.keys(cart).map(id => {
          const product = rawProducts.find(p => p.id == id);
          const qty = cart[id];
          const subtotal = product.price * qty;
          totalAmount += subtotal;
          return `
            <div class="py-3 flex justify-between items-center text-sm">
              <div>
                <p class="font-bold text-slate-200 leading-snug">${product.name}</p>
                <p class="text-xs text-slate-400">${qty} x $${product.price.toFixed(2)}</p>
              </div>
              <span class="font-black text-amber-400 text-base">$${subtotal.toFixed(2)}</span>
            </div>
          `;
        }).join('');
      }

      document.getElementById('cart-total').innerText = `$${totalAmount.toFixed(2)}`;
    }

    function toggleCart() {
      document.getElementById('cart-modal').classList.toggle('hidden');
    }

    function sendOrder() {
      if (Object.keys(cart).length === 0) {
        alert('Por favor agrega al menos un producto al carrito');
        return;
      }

      let text = `🛒 *NUEVO PEDIDO - Variedades el Toñeco*\n\n`;
      let total = 0;

      Object.keys(cart).forEach(id => {
        const product = rawProducts.find(p => p.id == id);
        const qty = cart[id];
        const subtotal = product.price * qty;
        total += subtotal;
        text += `• ${qty}x ${product.name} - $${subtotal.toFixed(2)}\n`;
      });

      const paymentMethod = document.getElementById('payment-method').value;

      text += `\n💰 *Total A Pagar:* $${total.toFixed(2)}`;
      text += `\n💳 *Método de Pago:* ${paymentMethod}`;
      text += `\n\n¡Hola! Quisiera confirmar este pedido.`;

      const phone = '584161721923';
      const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }

    init();
  </script>
