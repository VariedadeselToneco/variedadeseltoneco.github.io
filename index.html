<html lang="es">

<body class="bg-slate-900 text-slate-100 font-sans pb-24">

  <!-- ENCABEZADO Y DATOS DE LA EMPRESA -->

      <div>
        <h1 class="text-xl font-extrabold text-amber-400 tracking-wide">Variedades el Toñeco</h1>
        <p class="text-xs text-slate-300 font-medium"><i class="fa-solid fa-id-card text-amber-400 mr-1"></i> RIF: J-507753565</p>
        <p class="text-xs text-slate-300 font-medium"><i class="fa-solid fa-location-dot text-red-400 mr-1"></i> Carrera 8 entre 11 y 12</p>
      </div>
      <button onclick="toggleCart()" class="relative bg-amber-500 hover:bg-amber-400 text-slate-950 p-3 rounded-2xl font-bold shadow-lg transition duration-200">
        <i class="fa-solid fa-cart-shopping text-lg"></i>
        <span id="cart-count" class="absolute -top-1.5 -right-1.5 bg-red-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-800 font-black">0</span>
      </button>
    </div>

    <!-- BUSCADOR GLOBAL -->

      <div class="relative">

        <input type="text" id="search-input" oninput="handleSearch()" placeholder="Buscar en todo el catálogo..." class="w-full bg-slate-900/90 text-slate-100 border border-slate-700 rounded-xl pl-9 pr-3 py-2 text-sm focus:outline-none focus:border-amber-400">
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4">
    
    <!-- BARRA DE NAVEGACIÓN Y TÍTULO DE SECCIÓN -->
    <div id="navigation-header" class="mb-4 flex items-center justify-between">

        <button id="back-btn" onclick="showCategoriesView()" class="hidden bg-slate-800 hover:bg-slate-700 text-amber-400 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1">
          <i class="fa-solid fa-arrow-left"></i> Categorías
        </button>
        <h2 id="section-title" class="text-lg font-black text-white">Categorías</h2>
      </div>
      <span id="product-count-badge" class="text-xs font-bold bg-amber-400/10 text-amber-400 px-2.5 py-1 rounded-lg border border-amber-400/20 hidden"></span>
    </div>

    <!-- VISTA 1: GRILLA DE CATEGORÍAS PRINCIPAL -->
    <div id="categories-grid" class="grid grid-cols-2 gap-3"></div>

    <!-- VISTA 2: LISTA DESPLEGABLE / PRODUCTOS -->
    <div id="products-container" class="hidden space-y-2.5"></div>

  </main>

  <!-- MODAL DEL CARRITO DE COMPRAS -->
  <div id="cart-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex justify-end flex-col">
    <div class="bg-slate-800 rounded-t-3xl p-5 max-w-md w-full mx-auto max-h-[85vh] flex flex-col shadow-2xl border-t border-slate-700">
      <div class="flex justify-between items-center pb-3 border-b border-slate-700">
        <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2"><i class="fa-solid fa-basket-shopping"></i> Tu Pedido</h2>
        <button onclick="toggleCart()" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <!-- Ítems agregados -->
      <div id="cart-items" class="overflow-y-auto my-3 flex-1 divide-y divide-slate-700/50 pr-1"></div>

      <!-- Total y Checkout -->
      <div class="border-t border-slate-700 pt-3 space-y-3">
        <div class="flex justify-between items-center text-lg font-bold">
          <span>Total General:</span>
          <span id="cart-total" class="text-emerald-400 text-xl font-black">$0.00</span>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Método de Pago:</label>
          <select id="payment-method" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-400 font-medium">
            <option value="Pago Móvil">Pago Móvil</option>
            <option value="Transferencia BNC / Banesco">Transferencia (BNC / Banesco)</option>
            <option value="Zelle">Zelle</option>
            <option value="Banco Chileno (Penta / Estado)">Banco Chileno</option>
            <option value="Efectivo / Divisas">Efectivo / Divisas</option>
          </select>
        </div>

        <button onclick="sendOrder()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg flex items-center justify-center gap-2 text-base transition duration-200">

        </button>
      </div>
    </div>
  </div>

    let currentCategory = null;
    let cart = {};

    function init() {
      renderCategoriesGrid();
    }

    function renderCategoriesGrid() {
      const container = document.getElementById('categories-grid');
      
      container.innerHTML = Object.keys(categoriesData).map(cat => {
        const info = categoriesData[cat];
        const count = rawProducts.filter(p => p.cat === cat).length;
        
        return `
          <div onclick="selectCategory('${cat}')" class="relative rounded-2xl overflow-hidden shadow-lg border border-slate-700/80 h-36 flex flex-col justify-end p-3 cursor-pointer group hover:border-amber-400 transition duration-300">
            <img src="${info.img}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-110 transition duration-500 opacity-60">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
            
            <div class="relative z-10">
              <div class="w-8 h-8 rounded-xl bg-amber-400 text-slate-950 flex items-center justify-center font-bold text-sm mb-1 shadow-md">
                <i class="fa-solid ${info.icon}"></i>
              </div>
              <h3 class="font-extrabold text-white text-sm leading-tight">${cat}</h3>
              <p class="text-[11px] text-slate-300 font-medium">${count} productos</p>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectCategory(cat) {
      currentCategory = cat;
      document.getElementById('categories-grid').classList.add('hidden');
      document.getElementById('products-container').classList.remove('hidden');
      document.getElementById('back-btn').classList.remove('hidden');
      
      const badge = document.getElementById('product-count-badge');
      badge.classList.remove('hidden');

      document.getElementById('section-title').innerText = cat;
      
      renderProducts();
    }

    function showCategoriesView() {
      currentCategory = null;
      document.getElementById('search-input').value = '';
      document.getElementById('categories-grid').classList.remove('hidden');
      document.getElementById('products-container').classList.add('hidden');
      document.getElementById('back-btn').classList.add('hidden');
      document.getElementById('product-count-badge').classList.add('hidden');
      document.getElementById('section-title').innerText = 'Categorías';
    }

    function handleSearch() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      
      if (query !== '') {
        document.getElementById('categories-grid').classList.add('hidden');
        document.getElementById('products-container').classList.remove('hidden');
        document.getElementById('back-btn').classList.remove('hidden');
        document.getElementById('section-title').innerText = 'Resultados de Búsqueda';
        renderProducts(query);
      } else {
        if (currentCategory) {
          selectCategory(currentCategory);
        } else {
          showCategoriesView();
        }
      }
    }

    function renderProducts(searchQuery = '') {
      const container = document.getElementById('products-container');
      
      const filtered = rawProducts.filter(p => {
        const matchesCat = currentCategory ? p.cat === currentCategory : true;
        const matchesSearch = searchQuery ? p.name.toLowerCase().includes(searchQuery) : true;
        return matchesCat && matchesSearch;
      });

      document.getElementById('product-count-badge').innerText = `${filtered.length} ítems`;

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-400 py-12 text-sm font-medium">No hay productos disponibles.</p>`;
        return;
      }

      container.innerHTML = filtered.map(p => {
        const qty = cart[p.id] || 0;
        return `
          <div class="bg-slate-800/80 p-3.5 rounded-2xl border border-slate-700/60 flex justify-between items-center shadow-sm hover:border-slate-600 transition">
            <div class="pr-2">
              <h3 class="font-bold text-slate-100 text-sm leading-tight">${p.name}</h3>
              <p class="text-xs text-amber-400 font-extrabold mt-0.5">$${p.price.toFixed(2)}</p>
            </div>
            <div class="flex items-center gap-1.5 bg-slate-900 border border-slate-700/80 rounded-xl p-1 shrink-0">
              ${qty > 0 ? `
                <button onclick="updateQty(${p.id}, -1)" class="w-7 h-7 bg-slate-800 text-amber-400 rounded-lg font-black hover:bg-slate-700 transition flex items-center justify-center">-</button>
                <span class="text-xs font-black px-1.5 text-white">${qty}</span>
              ` : ''}
              <button onclick="updateQty(${p.id}, 1)" class="w-7 h-7 bg-amber-500 text-slate-950 rounded-lg font-black hover:bg-amber-400 transition flex items-center justify-center">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateQty(id, change) {
      cart[id] = (cart[id] || 0) + change;
      if (cart[id] <= 0) delete cart[id];
      updateCartUI();
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      renderProducts(searchQuery);
    }

    function updateCartUI() {
      const totalCount = Object.values(cart).reduce((sum, q) => sum + q, 0);
      document.getElementById('cart-count').innerText = totalCount;

      let totalAmount = 0;
      const itemsContainer = document.getElementById('cart-items');

      if (totalCount === 0) {
        itemsContainer.innerHTML = `<p class="text-center text-slate-400 py-8 text-sm font-medium">Tu carrito está vacío.</p>`;
      } else {
        itemsContainer.innerHTML = Object.keys(cart).map(id => {
          const product = rawProducts.find(p => p.id == id);
          const qty = cart[id];
          const subtotal = product.price * qty;
          totalAmount += subtotal;
          return `
            <div class="py-3 flex justify-between items-center text-sm">
              <div>
                <p class="font-bold text-slate-200 leading-snug">${product.name}</p>
                <p class="text-xs text-slate-400">${qty} x $${product.price.toFixed(2)}</p>
              </div>
              <span class="font-black text-amber-400 text-base">$${subtotal.toFixed(2)}</span>
            </div>
          `;
        }).join('');
      }

      document.getElementById('cart-total').innerText = `$${totalAmount.toFixed(2)}`;
    }

    function toggleCart() {
      document.getElementById('cart-modal').classList.toggle('hidden');
    }

    function sendOrder() {
      if (Object.keys(cart).length === 0) {
        alert('Por favor agrega al menos un producto al carrito');
        return;
      }

      let text = `🛒 *NUEVO PEDIDO - Variedades el Toñeco*\n\n`;
      let total = 0;

      Object.keys(cart).forEach(id => {
        const product = rawProducts.find(p => p.id == id);
        const qty = cart[id];
        const subtotal = product.price * qty;
        total += subtotal;
        text += `• ${qty}x ${product.name} - $${subtotal.toFixed(2)}\n`;
      });

      const paymentMethod = document.getElementById('payment-method').value;

      text += `\n💰 *Total A Pagar:* $${total.toFixed(2)}`;
      text += `\n💳 *Método de Pago:* ${paymentMethod}`;
      text += `\n\n¡Hola! Quisiera confirmar este pedido.`;

      const phone = '584161721923';
      const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
